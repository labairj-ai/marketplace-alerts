<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace Alerts</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    :root {
      --bg:          #f1f5f9;
      --surface:     #ffffff;
      --surface2:    #f8fafc;
      --border:      #e2e8f0;
      --border2:     #cbd5e1;
      --text:        #0f172a;
      --text2:       #475569;
      --muted:       #94a3b8;
      --accent:      #6366f1;
      --accent-d:    #4f46e5;
      --green:       #16a34a;
      --green-bg:    #dcfce7;
      --green-br:    #86efac;
      --amber:       #b45309;
      --amber-bg:    #fef3c7;
      --amber-br:    #fcd34d;
      --red:         #dc2626;
      --red-bg:      #fee2e2;
      --red-br:      #fca5a5;
      --blue:        #2563eb;
      --blue-bg:     #dbeafe;
      --blue-br:     #93c5fd;
      --header:      #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    input, select, textarea, button { font-family: inherit; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
      50%       { opacity: 0.7; transform: scale(0.9); box-shadow: 0 0 0 4px rgba(74,222,128,0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes slide-in {
      from { transform: translateY(-8px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

    a:hover { opacity: 0.8; }
    button:hover:not(:disabled) { opacity: 0.88; }

    @media (max-width: 640px) {
      .hide-mobile { display: none !important; }
      .ma-nav { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .ma-nav::-webkit-scrollbar { display: none; }
      .ma-header { padding: 0 14px !important; }
      .ma-main   { padding: 16px 12px !important; }
      .history-grid { grid-template-columns: auto 1fr auto !important; }
      .history-grid .hide-mobile { display: none !important; }
      .scan-grid { grid-template-columns: auto 1fr auto !important; }
      .scan-grid .hide-mobile { display: none !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API = url => fetch(url).then(r => r.json());

/* ─── Design tokens ─────────────────────────────────────────── */
const STATUS_C = {
  LIVE:                   { bg:"var(--green-bg)", color:"var(--green)",  border:"var(--green-br)" },
  DEMO:                   { bg:"var(--blue-bg)",  color:"var(--blue)",   border:"var(--blue-br)"  },
  NOT_CONFIGURED:         { bg:"var(--surface2)", color:"var(--muted)",  border:"var(--border2)"  },
  AUTHORIZATION_REQUIRED: { bg:"var(--red-bg)",   color:"var(--red)",    border:"var(--red-br)"   },
  ERROR:                  { bg:"var(--red-bg)",   color:"var(--red)",    border:"var(--red-br)"   },
  STALE:                  { bg:"var(--amber-bg)", color:"var(--amber)",  border:"var(--amber-br)" },
  SKIPPED:                { bg:"var(--surface2)", color:"var(--muted)",  border:"var(--border)"   },
};
const STATUS_LABELS = {
  LIVE:"● Live", DEMO:"◎ Demo", NOT_CONFIGURED:"○ Not configured",
  AUTHORIZATION_REQUIRED:"✕ Auth required", ERROR:"⚠ Error", STALE:"⏱ Stale", SKIPPED:"— Skipped",
};
const CONFIRMED_C = { bg:"var(--green-bg)", color:"var(--green)", border:"var(--green-br)" };
const POSSIBLE_C  = { bg:"var(--amber-bg)", color:"var(--amber)", border:"var(--amber-br)" };

/* ─── Primitives ─────────────────────────────────────────────── */
function Pill({ bg, color, border, children, style={} }) {
  return (
    <span style={{background:bg,color,border:`1px solid ${border}`,borderRadius:999,
      padding:"2px 10px",fontSize:11,fontWeight:600,letterSpacing:"0.01em",
      display:"inline-flex",alignItems:"center",gap:4,lineHeight:1.7,...style}}>
      {children}
    </span>
  );
}

function StatusBadge({ status }) {
  const c = STATUS_C[status] || STATUS_C.NOT_CONFIGURED;
  return <Pill {...c}>{STATUS_LABELS[status] || status}</Pill>;
}

function ClassBadge({ cls }) {
  const c = cls === "CONFIRMED" ? CONFIRMED_C : POSSIBLE_C;
  return <Pill {...c}>{cls === "CONFIRMED" ? "●" : "◐"} {cls}</Pill>;
}

function Btn({ onClick, children, variant="default", disabled, style={}, title }) {
  const V = {
    primary: {background:"var(--accent)",   color:"#fff",           border:"none"},
    success: {background:"var(--green)",    color:"#fff",           border:"none"},
    danger:  {background:"var(--red-bg)",   color:"var(--red)",     border:"1.5px solid var(--red-br)"},
    ghost:   {background:"transparent",     color:"var(--text2)",   border:"1.5px solid var(--border2)"},
    default: {background:"var(--surface2)", color:"var(--text2)",   border:"1.5px solid var(--border2)"},
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled} title={title} style={{
      ...V, padding:"7px 14px", borderRadius:8, fontSize:13, fontWeight:600,
      cursor:disabled?"not-allowed":"pointer", opacity:disabled?0.5:1,
      display:"inline-flex", alignItems:"center", gap:5,
      transition:"opacity 0.1s", whiteSpace:"nowrap", ...style,
    }}>
      {children}
    </button>
  );
}

function Loader() {
  return (
    <div style={{padding:48,textAlign:"center"}}>
      <div style={{display:"inline-block",width:22,height:22,border:"2.5px solid var(--border2)",
        borderTopColor:"var(--accent)",borderRadius:"50%",animation:"spin 0.65s linear infinite"}} />
    </div>
  );
}

function EmptyState({ icon, title, sub }) {
  return (
    <div style={{background:"var(--surface)",border:"1.5px dashed var(--border2)",borderRadius:14,
      padding:"52px 24px",textAlign:"center"}}>
      <div style={{fontSize:38,marginBottom:14,color:"var(--border2)"}}>{icon}</div>
      <div style={{fontSize:15,fontWeight:700,color:"var(--text)",marginBottom:6}}>{title}</div>
      <div style={{fontSize:12.5,color:"var(--muted)"}}>{sub}</div>
    </div>
  );
}

function PageHeader({ title, sub, children }) {
  return (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
      marginBottom:22,flexWrap:"wrap",gap:12}}>
      <div>
        <h2 style={{fontSize:21,fontWeight:700,color:"var(--text)",letterSpacing:"-0.02em"}}>{title}</h2>
        {sub && <p style={{color:"var(--muted)",fontSize:12,marginTop:2}}>{sub}</p>}
      </div>
      {children && <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>{children}</div>}
    </div>
  );
}

function Card({ children, style={} }) {
  return (
    <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,
      boxShadow:"0 1px 3px rgba(0,0,0,0.06)",overflow:"hidden",...style}}>
      {children}
    </div>
  );
}

function CardHeader({ children }) {
  return (
    <div style={{padding:"10px 20px",borderBottom:"1px solid var(--border)",
      background:"var(--surface2)",fontSize:11.5,color:"var(--muted)",fontWeight:600}}>
      {children}
    </div>
  );
}

function SegmentedControl({ options, value, onChange }) {
  return (
    <div style={{display:"flex",background:"var(--surface)",border:"1.5px solid var(--border2)",
      borderRadius:8,overflow:"hidden",flexShrink:0}}>
      {options.map((opt, i) => (
        <button key={opt} onClick={() => onChange(opt)} style={{
          padding:"5px 14px", fontSize:12.5, fontWeight:600, cursor:"pointer",
          background: value===opt ? "var(--accent)" : "transparent",
          color: value===opt ? "#fff" : "var(--text2)",
          border:"none", borderLeft: i>0 ? "1px solid var(--border2)" : "none",
          transition:"background 0.15s, color 0.15s",
        }}>
          {opt}
        </button>
      ))}
    </div>
  );
}

/* ─── Table helpers ──────────────────────────────────────────── */
const TH = {
  padding:"9px 14px", textAlign:"left", fontSize:11, fontWeight:600,
  color:"var(--muted)", letterSpacing:"0.03em", borderBottom:"1px solid var(--border)",
  whiteSpace:"nowrap", userSelect:"none",
};
const TD = { padding:"11px 14px", verticalAlign:"top" };

/* ─── Form helpers ───────────────────────────────────────────── */
const inp = {
  width:"100%", padding:"9px 12px",
  border:"1.5px solid var(--border2)", borderRadius:8,
  fontSize:13.5, color:"var(--text)", background:"var(--surface)", outline:"none",
};
const lbl = {
  display:"block", fontSize:11.5, color:"var(--text2)",
  fontWeight:600, marginBottom:5,
};

const EMPTY_FORM = {
  name:"", enabled:true, keywords:"", keyword_alts:"", brand:"",
  product_type:"", price_min:"", price_max:"", center_label:"Cincinnati, OH",
  center_lat:39.1031, center_lon:-84.5120, radius_miles:75,
  exclude_keywords:"", notify_email:true,
};

function SearchModal({ initial, onSave, onClose }) {
  const [form, setForm] = useState(initial || EMPTY_FORM);
  const [saving, setSaving] = useState(false);

  async function save() {
    setSaving(true);
    const payload = {
      ...form,
      keywords:         form.keywords.split(",").map(k=>k.trim()).filter(Boolean),
      keyword_alts:     form.keyword_alts ? form.keyword_alts.split(",").map(k=>k.trim()).filter(Boolean) : [],
      exclude_keywords: form.exclude_keywords ? form.exclude_keywords.split(",").map(k=>k.trim()).filter(Boolean) : [],
      price_min:  form.price_min  !== "" ? parseFloat(form.price_min)  : null,
      price_max:  form.price_max  !== "" ? parseFloat(form.price_max)  : null,
      center_lat: parseFloat(form.center_lat),
      center_lon: parseFloat(form.center_lon),
      radius_miles: parseFloat(form.radius_miles),
    };
    await onSave(payload);
    setSaving(false);
  }

  const F = (key, label, props={}) => (
    <div style={{marginBottom:14}}>
      <label style={lbl}>{label}</label>
      <input value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} style={inp} {...props} />
    </div>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.55)",display:"flex",
      alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)"}}>
      <div style={{background:"var(--surface)",borderRadius:16,padding:"28px 32px",
        width:"min(560px,96vw)",maxHeight:"90vh",overflowY:"auto",
        boxShadow:"0 24px 64px rgba(0,0,0,0.28)",border:"1px solid var(--border)",
        animation:"slide-in 0.18s ease-out"}}>
        <div style={{fontSize:16,fontWeight:700,color:"var(--text)",marginBottom:24,letterSpacing:"-0.01em"}}>
          {initial ? "Edit search" : "New saved search"}
        </div>

        {F("name", "Name")}

        <div style={{marginBottom:14}}>
          <label style={lbl}>Keywords <span style={{fontWeight:400,color:"var(--muted)"}}>comma-separated</span></label>
          <input value={form.keywords} onChange={e=>setForm({...form,keywords:e.target.value})}
            style={inp} placeholder="e.g. Mac Studio, Apple Mac Studio" />
        </div>

        <div style={{marginBottom:14}}>
          <label style={lbl}>Alternative keywords <span style={{fontWeight:400,color:"var(--muted)"}}>optional</span></label>
          <input value={form.keyword_alts} onChange={e=>setForm({...form,keyword_alts:e.target.value})}
            style={inp} placeholder="e.g. M1 Ultra Mac Studio" />
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <div>
            <label style={lbl}>Min price</label>
            <input type="number" value={form.price_min}
              onChange={e=>setForm({...form,price_min:e.target.value})} style={inp} placeholder="no minimum" />
          </div>
          <div>
            <label style={lbl}>Max price <span style={{fontWeight:400,color:"var(--muted)"}}>strict &lt;</span></label>
            <input type="number" value={form.price_max}
              onChange={e=>setForm({...form,price_max:e.target.value})} style={inp} placeholder="no maximum" />
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:14}}>
          <div>
            <label style={lbl}>Search center</label>
            <input value={form.center_label} onChange={e=>setForm({...form,center_label:e.target.value})}
              style={inp} placeholder="Cincinnati, OH" />
          </div>
          <div>
            <label style={lbl}>Radius (mi)</label>
            <input type="number" value={form.radius_miles}
              onChange={e=>setForm({...form,radius_miles:e.target.value})} style={inp} />
          </div>
        </div>

        <div style={{marginBottom:14}}>
          <label style={lbl}>Exclude keywords <span style={{fontWeight:400,color:"var(--muted)"}}>comma-separated</span></label>
          <input value={form.exclude_keywords} onChange={e=>setForm({...form,exclude_keywords:e.target.value})}
            style={inp} placeholder="e.g. Studio Display, MacBook, broken" />
        </div>

        <div style={{display:"flex",alignItems:"center",gap:20,marginBottom:26}}>
          <label style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:13}}>
            <input type="checkbox" checked={form.enabled} onChange={e=>setForm({...form,enabled:e.target.checked})} />
            Enabled
          </label>
          <label style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",fontSize:13}}>
            <input type="checkbox" checked={form.notify_email} onChange={e=>setForm({...form,notify_email:e.target.checked})} />
            Email on confirmed match
          </label>
        </div>

        <div style={{display:"flex",gap:10}}>
          <Btn onClick={onClose} variant="ghost" style={{flex:1,justifyContent:"center"}}>Cancel</Btn>
          <Btn onClick={save} variant="primary" disabled={saving||!form.name||!form.keywords}
            style={{flex:2,justifyContent:"center"}}>
            {saving ? "Saving…" : initial ? "Update search" : "Save search"}
          </Btn>
        </div>
      </div>
    </div>
  );
}

/* ─── Searches view ──────────────────────────────────────────── */
function SearchesView({ onCheckNow }) {
  const [searches, setSearches] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [checking, setChecking] = useState({});

  const load = useCallback(() => {
    setLoading(true);
    API("/api/searches").then(d => { setSearches(d); setLoading(false); });
  }, []);
  useEffect(() => { load(); }, [load]);

  async function saveSearch(payload) {
    if (modal && modal.id) {
      await fetch(`/api/searches/${modal.id}`, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    } else {
      await fetch("/api/searches", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    }
    setModal(null); load();
  }

  async function deleteSearch(id) {
    if (!confirm("Delete this saved search?")) return;
    await fetch(`/api/searches/${id}`, {method:"DELETE"});
    load();
  }

  async function toggleSearch(s) {
    await fetch(`/api/searches/${s.id}`, {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:!s.enabled})});
    load();
  }

  async function handleCheck(id) {
    setChecking(c => ({...c,[id]:true}));
    await onCheckNow(id);
    setChecking(c => ({...c,[id]:false}));
    load();
  }

  function editForm(s) {
    return {
      name:s.name, enabled:s.enabled, notify_email:s.notify_email,
      keywords:(s.keywords||[]).join(", "),
      keyword_alts:(s.keyword_alts||[]).join(", "),
      exclude_keywords:(s.exclude_keywords||[]).join(", "),
      price_min:s.price_min??"", price_max:s.price_max??"",
      center_label:s.center_label, center_lat:s.center_lat, center_lon:s.center_lon,
      radius_miles:s.radius_miles,
    };
  }

  if (loading) return <Loader />;

  return (
    <div>
      {modal !== null && (
        <SearchModal initial={modal==="new"?null:editForm(modal)} onSave={saveSearch} onClose={()=>setModal(null)} />
      )}

      <PageHeader title="Watchlist" sub={`${searches.length} saved search${searches.length!==1?"es":""}`}>
        <Btn onClick={()=>setModal("new")} variant="primary">+ Add search</Btn>
      </PageHeader>

      {searches.length === 0 ? (
        <EmptyState icon="◎" title="Nothing on your watchlist" sub="Add a saved search to start monitoring marketplaces for deals." />
      ) : searches.map(s => (
        <div key={s.id} style={{
          background:"var(--surface)", borderRadius:12, padding:"18px 20px", marginBottom:10,
          boxShadow:"0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)",
          border:"1px solid var(--border)",
          borderLeft:`4px solid ${s.enabled?"var(--green)":"var(--border2)"}`,
          transition:"box-shadow 0.15s",
        }}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,flexWrap:"wrap"}}>
                <span style={{fontWeight:700,fontSize:15,color:"var(--text)",letterSpacing:"-0.01em"}}>{s.name}</span>
                <Pill bg={s.enabled?"var(--green-bg)":"var(--surface2)"}
                  color={s.enabled?"var(--green)":"var(--muted)"}
                  border={s.enabled?"var(--green-br)":"var(--border2)"}>
                  {s.enabled?"● Active":"○ Paused"}
                </Pill>
                {(s.match_count||0) > 0 && (
                  <Pill bg="var(--blue-bg)" color="var(--blue)" border="var(--blue-br)">
                    {s.match_count} match{s.match_count!==1?"es":""}
                  </Pill>
                )}
              </div>

              <div style={{fontSize:12,color:"var(--text2)",display:"flex",flexWrap:"wrap",gap:"2px 16px",marginBottom:10}}>
                <span>{s.center_label} · {s.radius_miles} mi</span>
                {s.price_max != null && <span>Under ${s.price_max.toLocaleString()}</span>}
                {s.price_min != null && <span>Min ${s.price_min.toLocaleString()}</span>}
                {s.last_checked && <span style={{color:"var(--muted)"}}>Last scan {new Date(s.last_checked).toLocaleString()}</span>}
              </div>

              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {(s.keywords||[]).map(k => (
                  <span key={k} style={{background:"var(--surface2)",border:"1px solid var(--border)",
                    borderRadius:6,padding:"2px 8px",fontSize:11.5,color:"var(--text2)"}}>{k}</span>
                ))}
              </div>
            </div>

            <div style={{display:"flex",gap:6,flexShrink:0,flexWrap:"wrap"}}>
              <Btn onClick={()=>handleCheck(s.id)} variant="success" disabled={checking[s.id]}>
                {checking[s.id]?"Scanning…":"Scan now"}
              </Btn>
              <Btn onClick={()=>toggleSearch(s)} variant="ghost">{s.enabled?"Pause":"Resume"}</Btn>
              <Btn onClick={()=>setModal({...s,...editForm(s)})} variant="ghost">Edit</Btn>
              <Btn onClick={()=>deleteSearch(s.id)} variant="danger" title="Delete">✕</Btn>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── Listings view ──────────────────────────────────────────── */
function ListingsView() {
  const [listings, setListings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filterClass, setFilterClass] = useState("ALL");
  const [sort, setSort] = useState("newest");

  useEffect(() => {
    setLoading(true);
    let url = `/api/listings?sort=${sort}`;
    if (filterClass !== "ALL") url += `&classification=${filterClass}`;
    API(url).then(d => { setListings(d); setLoading(false); });
  }, [filterClass, sort]);

  const fmtPrice = p => p != null ? `$${Number(p).toLocaleString()}` : "—";
  const fmtDate  = d => d ? new Date(d).toLocaleDateString() : "—";

  return (
    <div>
      <PageHeader title="Listings" sub={`${listings.length} match${listings.length!==1?"es":""}`}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <SegmentedControl options={["ALL","CONFIRMED","POSSIBLE"]} value={filterClass} onChange={setFilterClass} />
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{
            border:"1.5px solid var(--border2)",borderRadius:8,padding:"6px 10px",
            fontSize:12.5,background:"var(--surface)",color:"var(--text)",cursor:"pointer"}}>
            <option value="newest">Newest first</option>
            <option value="price_asc">Price: low → high</option>
            <option value="price_desc">Price: high → low</option>
          </select>
        </div>
      </PageHeader>

      {loading ? <Loader /> : listings.length === 0 ? (
        <EmptyState icon="◎" title="No matches yet" sub="Run a scan to discover matching listings." />
      ) : (
        <>
          {["CONFIRMED","POSSIBLE"].map(cls => {
            const group = listings.filter(l =>
              filterClass==="ALL" ? l.classification===cls : l.classification===filterClass && l.classification===cls
            );
            if (filterClass!=="ALL" && filterClass!==cls) return null;
            if (!group.length) return null;
            return (
              <Card key={cls} style={{marginBottom:24}}>
                <CardHeader>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <ClassBadge cls={cls} />
                    <span>{group.length} listing{group.length!==1?"s":""}</span>
                  </div>
                </CardHeader>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead>
                      <tr style={{background:"var(--surface2)"}}>
                        <th style={{...TH, width:"40%"}}>Title</th>
                        <th style={{...TH, textAlign:"right"}}>Price</th>
                        <th style={{...TH}} className="hide-mobile">Location</th>
                        <th style={{...TH}} className="hide-mobile">Source</th>
                        <th style={{...TH}} className="hide-mobile">Search</th>
                        <th style={{...TH}} className="hide-mobile">Found</th>
                        <th style={{...TH}}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {group.map((l, ri) => (
                        <tr key={`${l.id}-${l.search_id}`}
                          style={{borderTop:"1px solid var(--border)",
                            background: ri%2===0 ? "var(--surface)" : "var(--surface2)"}}>
                          <td style={{...TD, maxWidth:0}}>
                            <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                              <a href={l.listing_url} target="_blank" rel="noreferrer"
                                style={{fontWeight:600,color:"var(--text)",textDecoration:"none"}}>
                                {l.title}
                              </a>
                            </div>
                            {(l.reasons||[]).length > 0 && (
                              <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:4}}>
                                {l.reasons.map((r,i) => (
                                  <span key={i} style={{background:"var(--surface2)",
                                    border:"1px solid var(--border)",borderRadius:4,
                                    padding:"1px 6px",fontSize:10.5,color:"var(--muted)"}}>{r}</span>
                                ))}
                              </div>
                            )}
                          </td>
                          <td style={{...TD, textAlign:"right", fontWeight:700, fontSize:15,
                            color:"var(--accent)", whiteSpace:"nowrap",
                            fontVariantNumeric:"tabular-nums", letterSpacing:"-0.02em"}}>
                            {fmtPrice(l.price)}
                          </td>
                          <td className="hide-mobile" style={{...TD, color:"var(--text2)", whiteSpace:"nowrap"}}>
                            {l.location_text||"—"}
                          </td>
                          <td className="hide-mobile" style={{...TD, color:"var(--text2)", whiteSpace:"nowrap"}}>
                            {l.source_name}
                          </td>
                          <td className="hide-mobile" style={{...TD, color:"var(--text2)", whiteSpace:"nowrap",
                            maxWidth:140, overflow:"hidden", textOverflow:"ellipsis"}}>
                            {l.search_name}
                          </td>
                          <td className="hide-mobile" style={{...TD, color:"var(--muted)", whiteSpace:"nowrap"}}>
                            {fmtDate(l.first_matched)}
                          </td>
                          <td style={{...TD, whiteSpace:"nowrap"}}>
                            {l.listing_url && (
                              <a href={l.listing_url} target="_blank" rel="noreferrer"
                                style={{fontSize:12,color:"var(--accent)",textDecoration:"none",fontWeight:600}}>
                                View →
                              </a>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>
            );
          })}
        </>
      )}
    </div>
  );
}

/* ─── History view ───────────────────────────────────────────── */
function HistoryView() {
  const [history, setHistory] = useState([]);
  const [scans, setScans]     = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    setLoading(true);
    Promise.all([API("/api/alerts/history"), API("/api/scans")]).then(([h,s]) => {
      setHistory(h); setScans(s); setLoading(false);
    });
  }, []);

  const fmtDate  = d => d ? new Date(d).toLocaleString() : "—";
  const fmtPrice = p => p != null ? `$${Number(p).toLocaleString()}` : "—";

  if (loading) return <Loader />;

  return (
    <div>
      <PageHeader title="History" sub="Match and scan records" />

      <Card style={{marginBottom:20}}>
        <CardHeader>Matched listings · {history.length} records</CardHeader>
        {history.length === 0 ? (
          <div style={{padding:24,textAlign:"center",color:"var(--muted)",fontSize:13}}>No match history yet.</div>
        ) : history.slice(0,50).map((h,i) => (
          <div key={h.id} className="history-grid" style={{
            display:"grid",gridTemplateColumns:"auto 1fr auto auto auto",
            gap:12,padding:"11px 20px",borderTop:i>0?"1px solid var(--border)":"none",
            alignItems:"center",background:i%2===0?"var(--surface)":"var(--surface2)"}}>
            <ClassBadge cls={h.classification} />
            <div>
              <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{h.listing_title}</div>
              <div style={{fontSize:11,color:"var(--muted)"}}>{h.search_name} · {h.source_name}</div>
            </div>
            <div style={{fontWeight:700,fontSize:14,color:"var(--accent)",whiteSpace:"nowrap",
              fontVariantNumeric:"tabular-nums"}}>{fmtPrice(h.price)}</div>
            <div className="hide-mobile" style={{fontSize:11,color:"var(--muted)",whiteSpace:"nowrap"}}>{fmtDate(h.first_matched)}</div>
            <div>{h.listing_url
              ? <a href={h.listing_url} target="_blank" rel="noreferrer"
                  style={{color:"var(--accent)",fontSize:12,fontWeight:600}}>View →</a>
              : "—"}</div>
          </div>
        ))}
      </Card>

      <Card>
        <CardHeader>Scan log · last 50 runs</CardHeader>
        {scans.length === 0 ? (
          <div style={{padding:24,textAlign:"center",color:"var(--muted)",fontSize:13}}>No scans yet.</div>
        ) : scans.map((s,i) => {
          const sc = s.status==="ok"
            ? {bg:"var(--green-bg)",color:"var(--green)",border:"var(--green-br)"}
            : s.status==="running"
            ? {bg:"var(--blue-bg)", color:"var(--blue)", border:"var(--blue-br)"}
            : {bg:"var(--red-bg)",  color:"var(--red)",  border:"var(--red-br)"};
          return (
            <div key={s.id} className="scan-grid" style={{
              display:"grid",gridTemplateColumns:"auto 1fr auto auto auto",
              gap:12,padding:"10px 20px",borderTop:i>0?"1px solid var(--border)":"none",
              alignItems:"center",background:i%2===0?"var(--surface)":"var(--surface2)"}}>
              <Pill {...sc}>{s.status}</Pill>
              <div style={{fontSize:12,color:"var(--text2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {s.provider||"scheduled"}{s.error?` — ${s.error.substring(0,80)}`:""}
              </div>
              <div className="hide-mobile" style={{fontSize:11,color:"var(--muted)",whiteSpace:"nowrap"}}>{s.result_count||0} results</div>
              <div className="hide-mobile" style={{fontSize:11,color:"var(--muted)",whiteSpace:"nowrap"}}>{s.match_count||0} matches</div>
              <div style={{fontSize:11,color:"var(--muted)",whiteSpace:"nowrap"}}>{fmtDate(s.started_at)}</div>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

/* ─── Status view ────────────────────────────────────────────── */
function StatusView() {
  const [status, setStatus] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = useCallback(() => {
    setLoading(true);
    API("/api/status").then(d => { setStatus(d); setLoading(false); });
  }, []);
  useEffect(() => { load(); const t = setInterval(load,30000); return ()=>clearInterval(t); }, [load]);

  if (loading) return <Loader />;
  const fmtDate = d => d ? new Date(d).toLocaleString() : "Never";

  return (
    <div>
      <PageHeader title="System Status" sub="Scheduler and source health">
        <Btn onClick={load} variant="ghost">↻ Refresh</Btn>
      </PageHeader>

      {status?.demo && (
        <div style={{background:"var(--blue-bg)",border:"1px solid var(--blue-br)",borderRadius:10,
          padding:"12px 18px",marginBottom:20,fontSize:13,color:"var(--blue)",fontWeight:500}}>
          Demo mode — fixture data only. No live marketplace data is being retrieved.
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:20}}>
        {[
          {label:"Scheduler",     value: status?.scheduler?.running ? "Running" : "Idle", hi: status?.scheduler?.running},
          {label:"Last run",      value: status?.scheduler?.lastRun?.at ? new Date(status.scheduler.lastRun.at).toLocaleTimeString() : "Never"},
          {label:"Next run",      value: status?.scheduler?.nextRun ? new Date(status.scheduler.nextRun).toLocaleTimeString() : "—"},
          {label:"Total listings",value: status?.stats?.totalListings ?? 0},
          {label:"Total matches", value: status?.stats?.totalMatches ?? 0},
        ].map(({label,value,hi}) => (
          <div key={label} style={{background:"var(--surface)",border:"1px solid var(--border)",
            borderRadius:10,padding:"16px 18px",boxShadow:"0 1px 3px rgba(0,0,0,0.05)"}}>
            <div style={{fontSize:11,color:"var(--muted)",marginBottom:7,fontWeight:500}}>{label}</div>
            <div style={{fontSize:21,fontWeight:700,color:hi?"var(--green)":"var(--text)",
              letterSpacing:"-0.02em",fontVariantNumeric:"tabular-nums"}}>{String(value)}</div>
          </div>
        ))}
      </div>

      <Card style={{marginBottom:16}}>
        <CardHeader>Data sources</CardHeader>
        {Object.entries(status?.sources||{}).map(([slug,src],i,arr) => (
          <div key={slug} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",
            padding:"14px 20px",borderTop:i>0?"1px solid var(--border)":"none",gap:12,flexWrap:"wrap"}}>
            <div>
              <div style={{fontWeight:600,fontSize:14,color:"var(--text)",marginBottom:3}}>{src.name}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>Last checked: {fmtDate(src.lastCheck)}</div>
              {src.error && <div style={{fontSize:12,color:"var(--red)",marginTop:3}}>{src.error.substring(0,120)}</div>}
            </div>
            <StatusBadge status={src.status} />
          </div>
        ))}
      </Card>

      {status?.lastScan && (
        <Card>
          <CardHeader>Last scan</CardHeader>
          <div style={{padding:"14px 20px",fontSize:13,color:"var(--text2)",lineHeight:2}}>
            Status: <strong style={{color:"var(--text)"}}>{status.lastScan.status}</strong> ·{" "}
            Results: <strong style={{color:"var(--text)"}}>{status.lastScan.result_count||0}</strong> ·{" "}
            Matches: <strong style={{color:"var(--text)"}}>{status.lastScan.match_count||0}</strong> ·{" "}
            Started: {fmtDate(status.lastScan.started_at)}
            {status.lastScan.error && <div style={{marginTop:6,color:"var(--red)"}}>{status.lastScan.error}</div>}
          </div>
        </Card>
      )}
    </div>
  );
}

/* ─── App shell ──────────────────────────────────────────────── */
function App() {
  const [tab, setTab]           = useState("searches");
  const [toast, setToast]       = useState(null);
  const [schedulerOn, setSchedOn] = useState(false);

  useEffect(() => {
    API("/api/status").then(d => setSchedOn(d?.scheduler?.running)).catch(()=>{});
  }, []);

  async function checkNow(searchId) {
    setToast({msg:"Scanning…", type:"info"});
    try {
      const r = await fetch(`/api/searches/${searchId}/check`,{method:"POST"}).then(r=>r.json());
      if (r.ok) setToast({msg:`Done — ${r.results} results, ${r.matches} matches`, type:"success"});
      else      setToast({msg:r.error||"Scan failed", type:"error"});
    } catch {
      setToast({msg:"Network error", type:"error"});
    }
    setTimeout(() => setToast(null), 4500);
  }

  const NAV = [
    {id:"searches", label:"Watchlist"},
    {id:"listings", label:"Listings"},
    {id:"history",  label:"History"},
    {id:"status",   label:"Status"},
  ];

  const toastBg = {info:"var(--accent)", success:"#15803d", error:"var(--red)"};

  return (
    <div>
      {/* ── Header ── */}
      <div className="ma-header" style={{background:"var(--header)",position:"sticky",top:0,zIndex:100,
        display:"flex",alignItems:"center",justifyContent:"space-between",
        padding:"0 24px",height:56,boxShadow:"0 1px 0 rgba(255,255,255,0.05),0 2px 8px rgba(0,0,0,0.3)"}}>

        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{
            width:9,height:9,borderRadius:"50%",flexShrink:0,
            background: schedulerOn ? "#4ade80" : "#475569",
            animation: schedulerOn ? "pulse-dot 2.2s ease-in-out infinite" : "none",
          }} />
          <span style={{fontWeight:700,fontSize:14.5,color:"#f8fafc",letterSpacing:"-0.02em",userSelect:"none"}}>
            Marketplace Alerts
          </span>
        </div>

        <nav className="ma-nav" style={{display:"flex",gap:1}}>
          {NAV.map(n => (
            <button key={n.id} onClick={()=>setTab(n.id)} style={{
              background: tab===n.id ? "rgba(99,102,241,0.25)" : "transparent",
              color: tab===n.id ? "#a5b4fc" : "#64748b",
              border:"none", padding:"6px 15px", borderRadius:7,
              cursor:"pointer", fontSize:13, fontWeight: tab===n.id ? 600 : 500,
              transition:"background 0.15s, color 0.15s",
            }}>
              {n.label}
            </button>
          ))}
        </nav>
      </div>

      {/* ── Toast ── */}
      {toast && (
        <div style={{
          position:"fixed",top:68,right:20,
          background:toastBg[toast.type]||"var(--accent)",color:"#fff",
          padding:"10px 18px",borderRadius:10,fontWeight:600,fontSize:13,
          zIndex:2000,boxShadow:"0 4px 20px rgba(0,0,0,0.25)",
          animation:"slide-in 0.18s ease-out",
        }}>
          {toast.msg}
        </div>
      )}

      {/* ── Main ── */}
      <div className="ma-main" style={{maxWidth:960,margin:"0 auto",padding:"26px 20px"}}>
        {tab==="searches" && <SearchesView onCheckNow={checkNow} />}
        {tab==="listings" && <ListingsView />}
        {tab==="history"  && <HistoryView />}
        {tab==="status"   && <StatusView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
